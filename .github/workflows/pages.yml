name: ERI Cert Check · Update Render data
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/certs.json'
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eri-cert-data-sync
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate source and Safari code
        run: |
          python3 -m py_compile scripts/sync.py
          node --check app.js
      - name: Download certificate metadata
        run: |
          mkdir -p site data
          python3 scripts/sync.py
          cp site/data/certs.json data/certs.json
      - name: Commit latest metadata and trigger Render auto deploy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/certs.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh ERI ESign certificate status"
            git push
          fi
